name: Release

# Push a version tag (e.g. v1.0.0) to publish a GitHub Release with every skill
# zipped for upload to the Claude app, plus one archive with all skills.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Check skill files and README
        run: python scripts/check_skills.py

      - name: Package skills
        run: bash scripts/package_skills.sh dist

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $version. Add one before tagging." >&2
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo "- **Claude app:** download a skill's zip below and add it under Customize > Skills > Upload a skill."
            echo "- **Claude Code:** download \`intentflow-skills-all.zip\` and unzip it into \`~/.claude/skills/\`."
          } >> "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "IntentFlow $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
