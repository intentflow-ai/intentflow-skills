name: Release

# Publishes a GitHub Release with every skill zipped for upload to the Claude app,
# plus one archive with all skills for Claude Code. Start it either way:
#   - Actions tab > Release > Run workflow, and enter a version such as v1.0.0
#   - or push a version tag such as v1.0.0
# Running it again for a version that's already released refreshes that release's zips and notes.
# The version needs its own section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.2.3 (got '$TAG')." >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      - name: Check skill files and README
        run: python scripts/check_skills.py

      - name: Package skills
        run: bash scripts/package_skills.sh dist

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $version. Add one before releasing." >&2
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo "- **Claude app:** download a skill's zip below and add it under Customize > Skills > Upload a skill."
            echo "- **Claude Code:** download \`intentflow-skills-all.zip\` and unzip it into \`~/.claude/skills/\`."
          } >> "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub Release
        run: |
          title="IntentFlow $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release with this tag already exists (for example, created on the Releases page):
            # attach the zips and use the changelog notes.
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/*.zip --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            # No tag yet: create it on the commit this workflow checked out.
            gh release create "$TAG" dist/*.zip --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          fi
          echo "Published $title"
